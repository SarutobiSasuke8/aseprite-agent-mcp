name: Release to PyPI and MCP Registry

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Check tag against single version source
        run: |
          VERSION=$(uv run python -c 'from aseprite_mcp import __version__; print(__version__)')
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/check_distribution.py
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      # Configure a PyPI trusted publisher for this repository, release.yml and pypi.
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set registry version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - name: Wait for PyPI ownership marker
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/aseprite-agent-mcp/$VERSION/json" | grep -q 'mcp-name: io.github.SarutobiSasuke8/aseprite-agent-mcp'; then
              exit 0
            fi
            sleep 10
          done
          echo 'PyPI did not serve the mcp-name marker' >&2
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
