[project]
name = "aseprite-agent-mcp"
dynamic = ["version"]
description = "An extensive Model Context Protocol (MCP) server for driving Aseprite (pixel-art editor) headlessly via Lua scripting and the Aseprite CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aseprite Agent MCP contributors" }]
keywords = ["aseprite", "mcp", "pixel-art", "sprite", "model-context-protocol", "animation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.4.0,<2",
    "pillow>=12.2.0",
]

[project.scripts]
aseprite-agent-mcp = "aseprite_mcp.agent_server:main"

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I001"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E701", "E702", "E741"]
"scripts/*" = ["E401", "E501", "E701", "E702", "E741"]

[tool.hatch.version]
path = "src/aseprite_mcp/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aseprite_mcp"]


[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README.md", "ROADMAP.md", "SECURITY.md", "CHANGELOG.md", "LICENSE", "NOTICE", "UPSTREAM_INVENTORY.json", "pyproject.toml", "uv.lock", "mcp-config.example.json", "examples/phaser/index.html", "examples/phaser/package.json", "examples/phaser/package-lock.json"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "aseprite_mcp/notices/LICENSE"
"NOTICE" = "aseprite_mcp/notices/NOTICE"
"UPSTREAM_INVENTORY.json" = "aseprite_mcp/notices/UPSTREAM_INVENTORY.json"
